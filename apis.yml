name: Kosmix
description: Kosmix Corporation was a Mountain View, California topic-discovery and search company operating
  from roughly 2005 to 2011. Rather than returning a ranked list of links, Kosmix automatically assembled
  a topic "home page for the web" for any subject, aggregating and categorizing content across health,
  science, food, sports, politics, travel, finance and other verticals. The company also shipped the
  RightHealth, MeeHive and Tweetbeat properties, the last of which filtered and organized real-time
  Twitter activity by topic. Kosmix was acquired by Walmart in 2011 and became the nucleus of @WalmartLabs;
  kosmix.com later 301-redirected to walmartlabs.com and the domain no longer resolves. This profile is
  retained as a historical record. There is no live Kosmix developer surface, API, or documentation to
  enrich.
